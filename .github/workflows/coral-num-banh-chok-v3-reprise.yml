name: Cuisine - Num Banh Chok V3 - quota protege
# No automatic cost. No push trigger. Only explicit manual authorization,
# bounded segment budget, one paid request per step, no automatic retries.
on:
  workflow_dispatch:
    inputs:
      authorize_paid_tts:
        description: 'Saisir OUI_J_AUTORISE pour des segments payants; NON = audit gratuit'
        required: true
        default: NON
        type: string
      max_new_segments:
        description: 'Budget MAXIMAL de segments dans ce lancement (0..25); 0 = aucun appel payant'
        required: true
        default: '0'
        type: string
      resume_run_id:
        description: 'ID du run avec fragments déjà confirmés, ou 0 pour un premier essai'
        required: true
        default: '0'
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: cuisine-num-banh-v3-manual-budget
  cancel-in-progress: false
jobs:
  offline_check:
    name: Prévol gratuit, aucune requête Coral
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ateliers-cinq-recettes-completes-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Contrats et garde quota sans internet payant
        run: |
          set -euo pipefail
          node scripts/check-workshop-blueprints.mjs
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --check
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --plan
          node tests/atelier-coral-quota-safety.test.mjs
  pay_with_limit:
    needs: offline_check
    name: Synthèse volontaire bornée, 25 segments maximum
    if: ${{ inputs.authorize_paid_tts == 'OUI_J_AUTORISE' && inputs.max_new_segments != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ateliers-cinq-recettes-completes-20261020
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Installer FFmpeg et FFprobe avant tout appel payant
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
      - name: Budget validé avant toute requête payante
        shell: bash
        env:
          LIMIT: ${{ inputs.max_new_segments }}
        run: |
          set -euo pipefail
          [[ "$LIMIT" =~ ^([1-9]|1[0-9]|2[0-5])$ ]] || { echo "STOP: budget invalide"; exit 1; }
          echo "Plafond de $LIMIT appels possibles, zero nouvel appel automatique apres echec."
      - name: Refuser une nouvelle facturation si des segments existent sans restauration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          if [ "$FROM_RUN" = '0' ]; then
            SAVED=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("cuisine-num-banh-v3-confirmed-"))] | length')
            if [ "$SAVED" -gt 0 ]; then
              echo "STOP QUOTA : $SAVED segment(s) deja sauvegardes; fournir le run_id d'origine avant toute nouvelle generation."
              exit 1
            fi
          fi
      - name: Restore confirmed segments from an earlier authorized run
        if: ${{ inputs.resume_run_id != '0' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: cuisine-num-banh-v3-confirmed-*
          merge-multiple: true
          path: .tmp-cooking-coral-restore
      - name: Restore and refuse ambiguous requests without triggering Coral
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .tmp-cooking-coral-restore ]; then
            SLUG=$(node -e "process.stdout.write(require('./src/data/atelier-recette-guides/num-banh-chok.json').slug)")
            mkdir -p ".tmp-cooking-coral/$SLUG/v3"
            find .tmp-cooking-coral-restore -type f \( -name '*.mp3' -o -name '*.uncertain.json' \) -exec cp -n {} ".tmp-cooking-coral/$SLUG/v3/" \;
          fi
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --check
      - name: Coral segment 1 sur 25 - intro 1/3
        if: ${{ fromJSON(inputs.max_new_segments) >= 1 }}
        run: node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --one=intro --part=1
      - name: Archiver segment 1 ou marqueur de resultat incertain
        if: ${{ always() && fromJSON(inputs.max_new_segments) >= 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-num-banh-v3-confirmed-01
          path: |
            .tmp-cooking-coral/*/v3/intro-part-01-*.mp3
            .tmp-cooking-coral/*/v3/intro-part-01-*.mp3.uncertain.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
      - name: Coral segment 2 sur 25 - intro 2/3
