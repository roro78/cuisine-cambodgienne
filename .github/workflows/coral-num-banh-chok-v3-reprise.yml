          retention-days: 90
          if-no-files-found: warn
      - name: Assemblage GRATUIT sur les segments deja confirmés
        if: ${{ fromJSON(inputs.max_new_segments) == 25 }}
        run: |
          set -euo pipefail
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --assemble
          node scripts/check-new-cooking-workshop-audio.mjs
          node scripts/check-culinary-lexicon.mjs
          node scripts/check-workshop-blueprints.mjs
      - name: Archiver le MP3 final avant de toucher au dépôt
        if: ${{ fromJSON(inputs.max_new_segments) == 25 }}
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-num-banh-v3-final
          path: |
            public/audio/workshops/num-banh-chok-sauce-et-herbes-fraiches/atelier-coral-v3.mp3
            src/data/atelier-recette-audio/num-banh-chok-v3.json
          retention-days: 90
          if-no-files-found: error
      - name: Commit du seul nouveau MP3 V3 après vérification
        if: ${{ fromJSON(inputs.max_new_segments) == 25 }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/audio/workshops/num-banh-chok-sauce-et-herbes-fraiches/atelier-coral-v3.mp3
          git add -- src/data/atelier-recette-audio/num-banh-chok-v3.json src/data/atelier-recette-guides/num-banh-chok.json
          git commit -m "audio(ateliers): Num Banh Chok V3, sept chapitres vérifiés"
          git fetch origin feat/ateliers-cinq-recettes-completes-20261020
          git rebase origin/feat/ateliers-cinq-recettes-completes-20261020
          git push origin HEAD:feat/ateliers-cinq-recettes-completes-20261020
