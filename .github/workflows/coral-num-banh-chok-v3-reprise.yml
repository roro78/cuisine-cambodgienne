name: Cuisine - Num Banh Chok V3 - quota protege
# MANUAL ONLY. Default execution is no-cost. Paid segment run requires explicit input.
# A confirmed segment is saved immediately. An uncertain request is never repeated.
on:
  workflow_dispatch:
    inputs:
      authorize_paid_tts:
        description: 'PAYANT: saisir OUI_J_AUTORISE_UN_SEGMENT pour permettre une nouvelle demande'
        required: true
        default: NON
        type: string
      segment:
        description: 'Partie exacte (1 à 25). Laisser VIDE pour un audit GRATUIT sans appel OpenAI.'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cuisine-num-banh-v3-quota-protege
  cancel-in-progress: false
jobs:
  safe_check:
    name: Audit gratuit, aucune voix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ateliers-cinq-recettes-completes-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Confirmer les textes approuves sans aucun appel API
        run: |
          set -euo pipefail
          node scripts/check-workshop-blueprints.mjs
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --check
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --plan
          node tests/atelier-coral-quota-safety.test.mjs
  one_paid_segment:
    name: Un segment Coral, confirmation humaine explicite
    needs: safe_check
    if: ${{ inputs.authorize_paid_tts == 'OUI_J_AUTORISE_UN_SEGMENT' && inputs.segment != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ateliers-cinq-recettes-completes-20261020
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: ffprobe verification
        run: command -v ffprobe
      - name: Valider index et parametres avant credit API
        shell: bash
        env:
          SEGMENT: ${{ inputs.segment }}
        run: |
          set -euo pipefail
          [[ "$SEGMENT" =~ ^([1-9]|1[0-9]|2[0-5])$ ]] || { echo 'STOP: index non autorise'; exit 1; }
          echo "Un seul segment facturable possible; aucune relance automatique."
      - name: Segment choisi (UN SEUL appel maximum)
        shell: bash
        env:
          SEGMENT: ${{ inputs.segment }}
        run: |
          set -euo pipefail
          case "$SEGMENT" in
            1) CHAPTER=intro; PART=1 ;;
            2) CHAPTER=intro; PART=2 ;;
            3) CHAPTER=intro; PART=3 ;;
            4) CHAPTER=installer; PART=1 ;;
            5) CHAPTER=installer; PART=2 ;;
            6) CHAPTER=installer; PART=3 ;;
            7) CHAPTER=installer; PART=4 ;;
            8) CHAPTER=preparer; PART=1 ;;
            9) CHAPTER=preparer; PART=2 ;;
            10) CHAPTER=preparer; PART=3 ;;
            11) CHAPTER=assembler; PART=1 ;;
            12) CHAPTER=assembler; PART=2 ;;
            13) CHAPTER=assembler; PART=3 ;;
            14) CHAPTER=assembler; PART=4 ;;
            15) CHAPTER=maitriser; PART=1 ;;
            16) CHAPTER=maitriser; PART=2 ;;
            17) CHAPTER=maitriser; PART=3 ;;
            18) CHAPTER=maitriser; PART=4 ;;
            19) CHAPTER=rectifier; PART=1 ;;
            20) CHAPTER=rectifier; PART=2 ;;
            21) CHAPTER=rectifier; PART=3 ;;
            22) CHAPTER=rectifier; PART=4 ;;
            23) CHAPTER=terminer; PART=1 ;;
            24) CHAPTER=terminer; PART=2 ;;
            25) CHAPTER=terminer; PART=3 ;;
            *) echo 'STOP segment inconnu'; exit 1 ;;
          esac
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --one="$CHAPTER" --part="$PART"
      - name: Sauvegarder fragment ou requete incertaine, meme apres echec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-num-banh-v3-segment-${{ inputs.segment }}-tentative-${{ github.run_id }}
          path: |
            .tmp-cooking-coral/*/v3/*.mp3
            .tmp-cooking-coral/*/v3/*.uncertain.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
