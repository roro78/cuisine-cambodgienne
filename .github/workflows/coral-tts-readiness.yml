name: Coral audio readiness - offline only
on:
  push:
    branches: ['feat/coral-tts-memory-*']
permissions:
  contents: read
jobs:
  candidate-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Candidate image only, production compose unchanged
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f deploy/coral/Dockerfile.audio-candidate -t coral-audio-candidate .
          mkdir candidate-evidence
          docker image inspect --format '{{json .Id}}' coral-audio-candidate > candidate-evidence/image-id.json
          docker run --rm --network none --read-only --cpus 0.5 --memory 256m --memory-swap 256m --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges coral-audio-candidate > candidate-evidence/tools-before.json
          set +e
          docker run --rm --network none --read-only coral-audio-candidate node scripts/editorial-ai-job-gateway.mjs > candidate-evidence/closed-bootstrap.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -qx JOB_STARTUP_REFUSED candidate-evidence/closed-bootstrap.log
      - name: Export, reload and verify exact image without registry publication
        run: |
          docker save coral-audio-candidate | gzip -n > candidate-evidence/coral-audio-candidate.tar.gz
          sha256sum candidate-evidence/coral-audio-candidate.tar.gz > candidate-evidence/archive-sha256.txt
          docker image rm coral-audio-candidate
          gunzip -c candidate-evidence/coral-audio-candidate.tar.gz | docker load
          docker image inspect --format '{{json .Id}}' coral-audio-candidate > candidate-evidence/reloaded-image-id.json
          cmp candidate-evidence/image-id.json candidate-evidence/reloaded-image-id.json
          docker run --rm --network none --read-only --cpus 0.5 --memory 256m --memory-swap 256m --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges coral-audio-candidate > candidate-evidence/tools-after.json
          cmp candidate-evidence/tools-before.json candidate-evidence/tools-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-audio-candidate-package
          path: candidate-evidence
          compression-level: 0
          if-no-files-found: error
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [representative, bounded-adverse]
        variant: [baseline, streaming]
        repeat: [1, 2]
        exclude:
          - {variant: baseline, repeat: 2}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Immutable baseline core plus identical instrumentation
        if: matrix.variant == 'baseline'
        run: |
          mkdir baseline
          git archive 0d5a688f7184d556a51dd1981593300d9421826b scripts src/data/atelier-recette-audio src/data/atelier-recette-guides | tar -x -C baseline
          cp -R tests baseline/
      - name: Build isolated image
        run: |
          context=.
          if [ '${{ matrix.variant }}' = baseline ]; then context=baseline; fi
          docker build -f "$context/tests/fixtures/coral-tts-load.Dockerfile" -t coral-readiness ./$context
      - name: Fresh cgroup - no network, production mounts or credentials
        run: |
          mkdir evidence
          sudo chown 1000:1000 evidence
          margin=false
          if [ '${{ matrix.variant }}' = streaming ]; then margin=true; fi
          docker run --name coral-offline --network none --read-only --cpus 0.5 --memory 256m --memory-swap 256m --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=0700 -v "$PWD/evidence:/evidence" \
            -e TTS_EVIDENCE_DIR=/evidence -e TTS_REQUIRE_RESOURCE_LIMITS=true -e TTS_REQUIRE_MARGIN=$margin \
            -e TTS_MEDIA_BACKUP=$margin \
            -e TTS_SCENARIO=${{ matrix.scenario }} coral-readiness
      - name: Capture isolated container outcome
        if: always()
        run: |
          docker inspect --format '{{json .State}}' coral-offline > evidence/container-state.json || true
          sudo chown -R "$(id -u):$(id -g)" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-memory-${{ matrix.variant }}-${{ matrix.scenario }}-${{ matrix.repeat }}
          path: evidence
          if-no-files-found: error
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json, gd
          coverage: none
      - name: Offline dependencies and all real content build
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm run build
      - name: Authority, Range, encrypted media, sub-fragments and costs
        env:
          TTS_EVIDENCE_DIR: artifacts/coral-contracts
        run: |
          php tests/php/editorial-all-guided-smoke.php dist
          php tests/php/editorial-coral-culinary-review-smoke.php dist
          node --test --test-concurrency=1 tests/coral-tts-authority.test.mjs tests/coral-tts-realtime-contract.test.mjs tests/coral-tts-transcript.test.mjs tests/coral-tts-http-range.test.mjs tests/coral-media-backup.test.mjs tests/coral-tts-checkpoints.test.mjs tests/coral-tts-fragment-cost.test.mjs tests/coral-authority-install-preflight.test.mjs
          mkdir -p artifacts/coral-contracts
          node scripts/coral-tts-fragment-cost-report.mjs > artifacts/coral-contracts/cost-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-readiness-contracts
          path: artifacts/coral-contracts
  restored-player:
    needs: memory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: coral-memory-streaming-*-1
          path: artifacts/restored
      - name: Browser outside worker resource envelope
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Play restored private MP3s and seek all fourteen chapter positions
        env:
          TTS_LONG_EVIDENCE_DIR: artifacts/restored
          TTS_RESTORED_PLAYER: 'true'
          TTS_RESTORED_DIR: restored-download-audio
        run: |
          node tests/fixtures/coral-tts-restored-download.mjs
          node --test tests/coral-tts-long-player.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-restored-player-proof
          path: |
            artifacts/restored/**/player-metrics.json
            artifacts/restored/**/download-restore-proof.json
