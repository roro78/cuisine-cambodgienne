          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
      - name: Assembler UN MP3 Coral V2 avec sept grands chapitres
        run: node scripts/bridge-cooking-workshops-coral.mjs --atelier=lok-lak --assemble
      - name: Controles de vrais MP3 et des horodatages
        run: |
          node scripts/check-new-cooking-workshop-audio.mjs
          node scripts/check-workshop-blueprints.mjs
          node --test tests/ateliers-cinq-recettes.test.mjs
      - name: Conserver un artefact pour ecoute humaine (non publie)
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-lok-lak-v2-review
          path: |
            public/audio/workshops/lok-lak-de-la-poele-a-l-assiette/atelier-coral-v2.mp3
            src/data/atelier-recette-audio/lok-lak-v2.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit uniquement les trois artefacts Lok Lak V2 dans la PR #92
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/audio/workshops/lok-lak-de-la-poele-a-l-assiette/atelier-coral-v2.mp3
          git add -- src/data/atelier-recette-audio/lok-lak-v2.json src/data/atelier-recette-guides/lok-lak.json
          git commit -m "audio(ateliers): nouveau Lok Lak V2 sept chapitres, revue humaine en attente"
          git push origin HEAD:feat/ateliers-cinq-recettes-completes-20261020
