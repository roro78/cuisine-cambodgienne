          path: .tmp-cooking-coral/lok-lak/v2/${phase}-part-*.mp3
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
      - name: Coral V2 - ${phase} (reprenable)
