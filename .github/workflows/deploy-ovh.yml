name: Publish OVH static branch

# Publication volontaire uniquement : aucun push main ne publie tout seul.
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "SHA complet (40 caracteres) du main valide pour production"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ovh-production
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish approved static site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate release commit pin
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Main only"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A complete 40-character SHA is required"; exit 1; }
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || { echo "main changed since approval"; exit 1; }

      - name: Checkout the pinned source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run all mandatory site contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run test:motion
          npm run test:recipes
          npm run test:editorial
          node scripts/audit-photo-coverage.mjs

      - name: Run Grand Diner regressions when included
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts['test:experiences'] ? 0 : 1)"; then
            npm run test:reception
            npm run test:pack
            npm run test:kitchen
            npm run test:timeline
            npm run test:dinner
            npm run test:experiences
          else
            echo "Grand Diner not included in this release."
          fi

      - name: Check all six Coral MP3 files and chapter timelines (offline)
        run: node scripts/check-workshop-audio.mjs

      - name: Build approved static site
        run: npm run build

      - name: Verify compiled historical SEO redirects
        run: |
          cp public/.htaccess dist/.htaccess
          node scripts/check-seo-legacy-redirects.mjs
          node scripts/check-seo-sitemap-integrity.mjs

      - name: Check generated experience routes when included
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts['test:built-experiences'] ? 0 : 1)"; then
            npm run test:built-experiences
          fi

      - name: Setup Chrome for Grand Diner browser checks
        id: chrome
        if: hashFiles('tests/experiences-browser-smoke.mjs') != ''
        uses: browser-actions/setup-chrome@v2

      - name: Run Grand Diner browser and print checks
        if: hashFiles('tests/experiences-browser-smoke.mjs') != ''
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser-experiences

      - name: Publish dist to ovh-production
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cuisine-du-cambodge-dist
          cp -a dist /tmp/cuisine-du-cambodge-dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clean -fdx

          if git ls-remote --exit-code --heads origin ovh-production >/dev/null 2>&1; then
            git fetch origin ovh-production
            git switch -C ovh-production origin/ovh-production
          else
            git switch --orphan ovh-production
          fi

          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/cuisine-du-cambodge-dist/. .
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin ovh-production
