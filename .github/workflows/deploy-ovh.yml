name: Publish OVH static branch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ovh-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Publish dist to ovh-production
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cuisine-du-cambodge-dist
          cp -a dist /tmp/cuisine-du-cambodge-dist

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clean -fdx

          if git ls-remote --exit-code --heads origin ovh-production >/dev/null 2>&1; then
            git fetch origin ovh-production
            git switch -C ovh-production origin/ovh-production
          else
            git switch --orphan ovh-production
          fi

          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/cuisine-du-cambodge-dist/. .
          git add -A

          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin ovh-production
