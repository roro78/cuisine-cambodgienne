name: Coral sauce tamarin — Render existing TTS ONE SHOT (no deploy)
on:
  push:
    branches:
      - feat/atelier-guide-sauce-tamarin-pilote-20261019
    paths:
      - .github/workflows/coral-tamarin-existing-one-shot.yml
permissions:
  contents: write
  actions: read
jobs:
  existing-coral-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout pilot without touching other branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install and verify MP3 measurement tools BEFORE generating any paid audio
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version | head -n 1
      - name: Adapt ONLY sauce-tamarin text for the existing generator
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --prepare
      - name: Fetch the EXISTING generator code from its pinned original commit
        shell: bash
        run: |
          git show 9992b7db7befc50658b1db365d86fc62b751551a:scripts/generate-workshop-audio.mjs > .tmp-guided-coral-once/scripts/generate-workshop-audio.mjs
          test -s .tmp-guided-coral-once/scripts/generate-workshop-audio.mjs
          echo "Pinned existing generator found (no second TTS generator)."
      - name: Dry run with existing generator; Coral voice, seven parts
        shell: bash
        run: |
          cd .tmp-guided-coral-once
          node scripts/generate-workshop-audio.mjs --dry-run --workshop=piler-aromates-au-mortier --track=all --voice=coral --max-files=7
      - name: Restore intro from previous one-shot run (no re-synthesis)
        uses: actions/download-artifact@v4
        with:
          name: sauce-tamarin-coral-7-original-tracks
          run-id: 39438816501
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier
      - name: Check recovered intro integrity before any billable request
        shell: bash
        run: |
          test -s .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/intro.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/intro.mp3
      - name: Synthesize only etape-01 through IA-Coach existing Coral backend
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --render-one=etape-01
      - name: Save etape-01 immediately for safe resumption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-checkpoint-etape-01
          path: .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/etape-01.mp3
          retention-days: 14
          if-no-files-found: warn
      - name: Synthesize only etape-02 through IA-Coach existing Coral backend
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --render-one=etape-02
      - name: Save etape-02 immediately for safe resumption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-checkpoint-etape-02
          path: .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/etape-02.mp3
          retention-days: 14
          if-no-files-found: warn
      - name: Synthesize only etape-03 through IA-Coach existing Coral backend
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --render-one=etape-03
      - name: Save etape-03 immediately for safe resumption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-checkpoint-etape-03
          path: .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/etape-03.mp3
          retention-days: 14
          if-no-files-found: warn
      - name: Synthesize only etape-04 through IA-Coach existing Coral backend
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --render-one=etape-04
      - name: Save etape-04 immediately for safe resumption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-checkpoint-etape-04
          path: .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/etape-04.mp3
          retention-days: 14
          if-no-files-found: warn
      - name: Synthesize only etape-05 through IA-Coach existing Coral backend
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --render-one=etape-05
      - name: Save etape-05 immediately for safe resumption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-checkpoint-etape-05
          path: .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/etape-05.mp3
          retention-days: 14
          if-no-files-found: warn
      - name: Synthesize only etape-06 through IA-Coach existing Coral backend
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --render-one=etape-06
      - name: Save etape-06 immediately for safe resumption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-checkpoint-etape-06
          path: .tmp-guided-coral-once/public/audio/workshops/piler-aromates-au-mortier/etape-06.mp3
          retention-days: 14
          if-no-files-found: warn
      - name: Concatenate seven REAL MP3 tracks, measure chapters and verify output
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --assemble
      - name: Store the new MP3 and its measured chapters for review
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-review-once
          path: |
            public/audio/workshops/pratique-sauce-tamarin/atelier-coral.mp3
            src/data/guided-workshop-audio/sauce-tamarin.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit ONLY the new reviewed-structure MP3 on draft branch
        shell: bash
        run: |
          ffmpeg -v error -i public/audio/workshops/pratique-sauce-tamarin/atelier-coral.mp3 -f null -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/audio/workshops/pratique-sauce-tamarin/atelier-coral.mp3 src/data/guided-workshop-audio/sauce-tamarin.json
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "assets(ateliers): audio Coral du tamarin (revue à l'écoute requise)"
          git push origin "HEAD:feat/atelier-guide-sauce-tamarin-pilote-20261019"
