name: Coral sauce tamarin — Render existing TTS ONE SHOT (no deploy)
on:
  push:
    branches:
      - feat/atelier-guide-sauce-tamarin-pilote-20261019
    paths:
      - .github/workflows/coral-tamarin-existing-one-shot.yml
permissions:
  contents: write
jobs:
  existing-coral-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pilot without touching other branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Adapt ONLY sauce-tamarin text for the existing generator
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --prepare
      - name: Fetch the EXISTING generator code from its pinned original commit
        shell: bash
        run: |
          git show 9992b7db7befc50658b1db365d86fc62b751551a:scripts/generate-workshop-audio.mjs > .tmp-guided-coral-once/scripts/generate-workshop-audio.mjs
          test -s .tmp-guided-coral-once/scripts/generate-workshop-audio.mjs
          echo "Pinned existing generator found (no second TTS generator)."
      - name: Dry run with existing generator; Coral voice, seven parts
        shell: bash
        run: |
          cd .tmp-guided-coral-once
          node scripts/generate-workshop-audio.mjs --dry-run --workshop=piler-aromates-au-mortier --track=all --voice=coral --max-files=7
      - name: Generate ONLY seven Coral tracks via existing IA-Coach Render TTS backend
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --render
      - name: Concatenate seven REAL MP3 tracks, measure chapters and verify output
        run: node scripts/bridge-guided-tamarin-existing-coral.mjs --assemble
      - name: Store the new MP3 and its measured chapters for review
        uses: actions/upload-artifact@v4
        with:
          name: sauce-tamarin-coral-review-once
          path: |
            public/audio/workshops/pratique-sauce-tamarin/atelier-coral.mp3
            src/data/guided-workshop-audio/sauce-tamarin.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit ONLY the new reviewed-structure MP3 on draft branch
        shell: bash
        run: |
          ffmpeg -v error -i public/audio/workshops/pratique-sauce-tamarin/atelier-coral.mp3 -f null -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/audio/workshops/pratique-sauce-tamarin/atelier-coral.mp3 src/data/guided-workshop-audio/sauce-tamarin.json
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "assets(ateliers): audio Coral du tamarin (revue à l'écoute requise)"
          git push origin "HEAD:feat/atelier-guide-sauce-tamarin-pilote-20261019"
