name: Cuisine - Num Banh Chok V3 complet (une seule execution)
# Explicit user approval: complete the seven chapters even if new API credits are spent.
# One attempt per segment, no automatic retry, 90-day checkpoint retention.
# NEVER change Lok Lak, other ateliers, OVH or production.
on:
  push:
    branches:
      - feat/ateliers-cinq-recettes-completes-20261020
    paths:
      - docs/ateliers/GO-NUM-BANH-V3-COMPLET-20261021.txt
permissions:
  contents: write
  actions: read
concurrency:
  group: cuisine-num-banh-v3-complete-user-authorized-20261021
  cancel-in-progress: false
jobs:
  complete_once:
    name: Générer 24 segments manquants, assembler le MP3 approuvé
    if: ${{ github.run_attempt == 1 && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: feat/ateliers-cinq-recettes-completes-20261020
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies for offline validation
        run: npm install --no-audit --no-fund
      - name: Install local FFmpeg and FFprobe before any paid request
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Check 7 approved scripts and anti-quota regression WITHOUT any TTS
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'AUTORISATION_UTILISATEUR_CORAL_NUM_BANH_COMPLET_2026-10-21' docs/ateliers/GO-NUM-BANH-V3-COMPLET-20261021.txt
          node scripts/check-workshop-blueprints.mjs
          node tests/atelier-coral-quota-safety.test.mjs
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --check
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --plan
      - name: Restore FIRST confirmed MP3 from prior successful test, no duplicate charge
        uses: actions/download-artifact@v4
        with:
          name: cuisine-num-banh-v3-confirmed-01
          run-id: 39629603778
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .saved-coral-confirmed
      - name: SHA-verify preserved first segment and copy into V3 workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .saved-coral-confirmed -type f -name '*.mp3' | wc -l)" -eq 1
          test "$(find .saved-coral-confirmed -type f -name '*.uncertain.json' | wc -l)" -eq 0
          FILE="$(find .saved-coral-confirmed -type f -name '*.mp3' -print -quit)"
          SLUG="$(node -e "process.stdout.write(require('./src/data/atelier-recette-guides/num-banh-chok.json').slug)")"
          mkdir -p ".tmp-cooking-coral/$SLUG/v3"
          export FILE
          node --input-type=module <<'NODE'
          import {readFileSync,statSync} from 'node:fs';
          import {basename} from 'node:path';
          import {createHash} from 'node:crypto';
          const guide=JSON.parse(readFileSync('src/data/atelier-recette-guides/num-banh-chok.json','utf8'));
          const ss=guide.audio.intro.trim().split(/(?<=[.!?…])\s+/u);
          let part='';
          for(const line of ss){if(part&&part.length+line.length+1>480)break;part+=(part?' ':'')+line}
          const hash=createHash('sha256').update(part).digest('hex').slice(0,16);
          if(basename(process.env.FILE)!=='intro-part-01-'+hash+'.mp3'||statSync(process.env.FILE).size<30000)
            throw Error('STOP - MP3 conserve ne correspond pas au script approuve');
          console.log('FIRST_MP3_SAVED_QUALITY_OK '+hash+' bytes='+statSync(process.env.FILE).size);
          NODE
          cp -n "$FILE" ".tmp-cooking-coral/$SLUG/v3/"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE"
          ffmpeg -v error -i "$FILE" -f null -
          # Idempotent check: this command MUST skip the TTS call because MP3 is present.
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --one=intro --part=1
      - name: "Coral 02/25 - intro 2/3"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bridge-cooking-workshops-coral.mjs --atelier=num-banh-chok --edition=approved-v3 --one=intro --part=2
      - name: "Checkpoint 02/25 - MP3 ou appel incertain"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-banh-v3-checkpoint-02
          path: |
            .tmp-cooking-coral/*/v3/intro-part-02-*.mp3
            .tmp-cooking-coral/*/v3/intro-part-02-*.mp3.uncertain.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
      - name: "Coral 03/25 - intro 3/3"
        shell: bash
