name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type and Astro checks
        run: npm run check

      - name: Motion regression contract
        run: npm run test:motion

      - name: Recipe regression contract
        run: npm run test:recipes

      - name: Editorial regression contract
        run: npm run test:editorial

      - name: n8n social guards and integration diagnostics (offline, no network)
        run: |
          node --check scripts/sync-cuisine-n8n-runtime.mjs
          node --check scripts/verify-cuisine-integrations-readonly.mjs
          node --test --test-concurrency=1 \
            tests/social-pipeline.test.mjs \
            tests/n8n-runtime-sync.test.mjs \
            tests/social-full-path-offline.test.mjs \
            tests/verify-cuisine-integrations-readonly.test.mjs \
            tests/workflow-01-dryrun.test.mjs \
            tests/social-approval-email-preview.test.mjs \
            tests/workflow-01-full-path-simulation.test.mjs \
            tests/reconcile-kroeung-meta-readonly.test.mjs \
            tests/social-image-contract.test.mjs

      - name: Enable ffprobe for real MP3 integrity checks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            # npm already worked for the project. Use pinned static binaries before
            # falling back to Ubuntu apt mirrors that can hang unpredictably.
            FFTOOLS_DIR="$RUNNER_TEMP/cuisine-fftools"
            mkdir -p "$FFTOOLS_DIR"
            if timeout --signal=TERM --kill-after=10s 120s npm install --no-save --ignore-scripts --no-audit --no-fund \
              @ffprobe-installer/ffprobe@2.1.2 @ffmpeg-installer/ffmpeg@1.1.0; then
              FFPROBE_STATIC=$(node -p "require('@ffprobe-installer/ffprobe').path")
              FFMPEG_STATIC=$(node -p "require('@ffmpeg-installer/ffmpeg').path")
              install -m 755 "$FFPROBE_STATIC" "$FFTOOLS_DIR/ffprobe"
              install -m 755 "$FFMPEG_STATIC" "$FFTOOLS_DIR/ffmpeg"
              echo "$FFTOOLS_DIR" >> "$GITHUB_PATH"
              export PATH="$FFTOOLS_DIR:$PATH"
            else
              echo "::warning::Pinned npm binaries unavailable; trying bounded Ubuntu apt fallback."
              timeout --signal=TERM --kill-after=10s 120s sudo apt-get update -qq
              timeout --signal=TERM --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
            fi
          fi
          command -v ffmpeg
          command -v ffprobe
          ffprobe -version | sed -n '1p'
          ffmpeg -version | sed -n '1p'

      - name: Standard ateliers — recette réutilisable et guide MP3 (sans TTS)
        run: |
          node scripts/check-workshop-blueprints.mjs
          node --test tests/atelier-standard.test.mjs
          node --test tests/atelier-kroeung-page.test.mjs
          node --test tests/ateliers-cinq-recettes.test.mjs
          node --check scripts/bridge-cooking-workshops-coral.mjs
          node --test tests/coral-lok-lak-v2-plan.test.mjs
          node --test tests/cooking-audio-review.test.mjs
          node --test tests/workshop-mobile-narration-scroll.test.mjs
          node scripts/check-new-cooking-workshop-audio.mjs | tee /tmp/cuisine-six-new-audio-review.txt
          grep -q '^NEW_GUIDED_AUDIO_SUMMARY 6/6 MP3 measured' /tmp/cuisine-six-new-audio-review.txt

      - name: Validate all six Coral MP3s and actual chapter boundaries (offline)
        run: node scripts/check-workshop-audio.mjs

      - name: Verify photo inventory references
        run: node scripts/audit-photo-coverage.mjs

      - name: Reception notebook editorial and schedule checks
        run: npm run test:reception

      - name: Personal dinner roadmap calculations
        run: npm run test:pack

      - name: Guided cooking preview model
        run: npm run test:kitchen

      - name: Dinner timeline calculations
        run: npm run test:timeline

      - name: Dinner preview calculations
        run: npm run test:dinner

      - name: Experiences prelaunch regression contract
        run: npm run test:experiences

      - name: V17 approved homepage route/link contract
        run: node scripts/check-v17-accueil-contract.mjs

      - name: Production build
        run: npm run build

      - name: Generate autonomous six-post social review (offline)
        run: node scripts/build-social-review.mjs

      - name: Validate real image and caption review artifact (offline)
        run: node --test tests/social-review-preview.test.mjs

      - name: Upload mobile social editorial preview (download only, no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-social-preview-six-posts
          path: artifacts/social-editorial-review.html
          retention-days: 14
          if-no-files-found: error

      - name: Verify copied Apache SEO redirect file
        run: |
          cp public/.htaccess dist/.htaccess
          node scripts/build-workshop-redirects.mjs
          node scripts/prune-legacy-workshop-audio.mjs
          node scripts/check-seo-legacy-redirects.mjs
          node scripts/check-seo-sitemap-integrity.mjs
          node scripts/check-workshop-cutover.mjs

      - name: Approved images and editorial captions (offline)
        run: node --test tests/workshop-approved-images.test.mjs

      - name: Future release cutover simulation (isolated, no deployment)
        run: node scripts/simulate-six-workshop-release.mjs

      - name: Built pages and deployment boundaries
        run: npm run test:built-experiences
        
      - name: Setup Chrome for responsive browser smoke
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Browser journey and A4 print styles
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser-experiences

      - name: Cinq ateliers complets - QA mobile et desktop
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/ateliers-cinq-browser.test.mjs

      - name: Kroeung véritable atelier - navigateur mobile et ordinateur
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/atelier-kroeung-browser.test.mjs

      - name: Atelier mortier mobile bottom-dock browser regression
        if: github.ref == 'refs/heads/feat/atelier-mortier-mobile-dock-slides-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/workshop-mobile-dock-browser.test.mjs

      - name: Atelier sauce Coral - MP3 integrity and responsive player
        if: github.ref == 'refs/heads/feat/atelier2-sauce-coral-mobile-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/check-workshop-audio.mjs --slug=equilibrer-une-sauce
          node tests/workshop-sauce-audio-browser.test.mjs

      - name: Atelier viande Coral - MP3 integrity and responsive player
        if: github.ref == 'refs/heads/feat/atelier3-viande-coral-mobile-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/check-workshop-audio.mjs --slug=saisir-viande-poele
          node tests/workshop-viande-audio-browser.test.mjs

      - name: Atelier herbes Coral - MP3 integrity and responsive player
        if: github.ref == 'refs/heads/feat/atelier4-herbes-coral-mobile-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/check-workshop-audio.mjs --slug=fraicheur-herbes-agrumes
          node tests/workshop-herbes-audio-browser.test.mjs

      - name: Atelier bouillon Coral - MP3 integrity and responsive player
        if: github.ref == 'refs/heads/feat/atelier5-bouillon-coral-mobile-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/check-workshop-audio.mjs --slug=bouillon-leger-savoureux
          node tests/workshop-bouillon-audio-browser.test.mjs

      - name: Atelier repas Coral - MP3 integrity and responsive player
        if: github.ref == 'refs/heads/feat/atelier6-repas-coral-mobile-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/check-workshop-audio.mjs --slug=composer-repas-cambodgien
          node tests/workshop-repas-audio-browser.test.mjs

      - name: Mobile narration sheet - swipe chapters and six workshop QA
        if: github.ref == 'refs/heads/feat/atelier-mobile-expanded-narration-sheet-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/workshop-expanded-mobile-qa.mjs

      - name: Install Playwright video encoder
        run: node ./node_modules/playwright-core/cli.js install ffmpeg

      # Revue visuelle du lot Carnets, sans déploiement ni appel Meta.
      # Ce test ne faisait pas partie de la CI globale initiale.
      - name: Carnets release QA (7 stories, 3 universes, mobile and desktop)
        if: github.ref == 'refs/heads/feat/carnets-release-consolidee-20261022'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/carnets-responsive-browser.test.mjs

      - name: Upload Carnets release screenshots
        if: always() && github.ref == 'refs/heads/feat/carnets-release-consolidee-20261022'
        uses: actions/upload-artifact@v4
        with:
          name: carnets-111-mobile-desktop-evidence
          path: artifacts/carnets-review/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: V17 complete responsive browser regression (no video)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          V17_FULL_EVIDENCE: '0'
          V17_ONLY_NOJS: ${{ github.ref == 'refs/heads/feat/v17-finition-artistique-d11' && '1' || '0' }}
        run: node tests/v17-accueil-browser-smoke.mjs

      - name: V17 D25 focused mobile and desktop section 5 videos
        if: github.ref == 'refs/heads/feat/v17-finition-artistique-d11'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/v17-section5-two-videos.mjs

      - name: V19 photographic editorial pages QA
        if: github.ref == 'refs/heads/feat/v19-refonte-editoriale-photorealiste-20261016'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/v19-editorial-browser-qa.mjs

      - name: Upload V19 desktop and mobile editorial screenshots
        if: always() && github.ref == 'refs/heads/feat/v19-refonte-editoriale-photorealiste-20261016'
        uses: actions/upload-artifact@v4
        with:
          name: v19-editorial-visual-review
          path: artifacts/v19-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: V21 atelier tutorial responsive QA
        if: github.ref == 'refs/heads/feat/v20-ateliers-hero-pedagogie-20261017'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/v21-atelier-browser-qa.mjs

      - name: Upload V21 workshop tutorial screenshots
        if: always() && github.ref == 'refs/heads/feat/v20-ateliers-hero-pedagogie-20261017'
        uses: actions/upload-artifact@v4
        with:
          name: v21-workshop-tutorial-visual-review
          path: artifacts/v21-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Editorial French and mobile green contrast QA
        if: github.ref == 'refs/heads/fix/editorial-fr-food-copy-mobile-contrast-20261017'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/editorial-cuisine-contrast-qa.mjs

      - name: Upload recipe mobile contrast screenshots
        if: always() && github.ref == 'refs/heads/fix/editorial-fr-food-copy-mobile-contrast-20261017'
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-recettes-contrast-visual-review
          path: artifacts/editorial-recettes-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Shared glossary-style editorial hero browser QA
        if: github.ref == 'refs/heads/feat/unified-editorial-heroes-glossary-template-20261017'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/shared-editorial-hero-browser-qa.mjs

      - name: Upload seven shared-page mobile and desktop screenshots
        if: always() && github.ref == 'refs/heads/feat/unified-editorial-heroes-glossary-template-20261017'
        uses: actions/upload-artifact@v4
        with:
          name: shared-glossary-page-frames
          path: artifacts/shared-hero-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: V17 D8 public homepage Lighthouse mobile audit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          V17_AUDIT_ROUTE: /
        run: node scripts/v17-lighthouse-audit.mjs

      - name: Upload V17 D25 focused video evidence
        if: always() && github.ref == 'refs/heads/feat/v17-finition-artistique-d11'
        uses: actions/upload-artifact@v4
        with:
          name: v17-d25-mobile-desktop-section5
          path: |
            artifacts/v17-d25-*.webm
            artifacts/v17-d25-*.png
            artifacts/v17-d25-*.json
            artifacts/v17-d27-*.png
            artifacts/v17-d27-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload V17 responsive screenshots and scroll videos
        if: always() && github.ref != 'refs/heads/feat/v17-finition-artistique-d11'
        uses: actions/upload-artifact@v4
        with:
          name: v17-accueil-d7-browser-evidence
          path: |
            artifacts/v17-accueil-*.png
            artifacts/v17-accueil-*.webm
            artifacts/v17-accueil-d7-metrics-*.json
            artifacts/v17-recipe-*.png
            artifacts/v17-lighthouse-mobile*.json
          retention-days: 7
          if-no-files-found: ignore
