name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "perf/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type and Astro checks
        run: npm run check

      - name: Motion regression contract
        run: npm run test:motion

      - name: Recipe regression contract
        run: npm run test:recipes

      - name: Editorial regression contract
        run: npm run test:editorial

      - name: Verify photo inventory references
        run: node scripts/audit-photo-coverage.mjs

      - name: Reception notebook editorial and schedule checks
        run: npm run test:reception

      - name: Personal dinner roadmap calculations
        run: npm run test:pack

      - name: Guided cooking preview model
        run: npm run test:kitchen

      - name: Dinner timeline calculations
        run: npm run test:timeline

      - name: Dinner preview calculations
        run: npm run test:dinner

      - name: Experiences prelaunch regression contract
        run: npm run test:experiences

      - name: V17 approved homepage route/link contract
        run: node scripts/check-v17-accueil-contract.mjs

      - name: Production build
        run: npm run build

      - name: Built pages and deployment boundaries
        run: npm run test:built-experiences
        
      - name: Setup Chrome for responsive browser smoke
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Browser journey and A4 print styles
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:browser-experiences

      - name: Atelier mortier mobile bottom-dock browser regression
        if: github.ref == 'refs/heads/feat/atelier-mortier-mobile-dock-slides-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/workshop-mobile-dock-browser.test.mjs

      - name: Atelier sauce Coral - MP3 integrity and responsive player
        if: github.ref == 'refs/heads/feat/atelier2-sauce-coral-mobile-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/check-workshop-audio.mjs --slug=equilibrer-une-sauce
          node tests/workshop-sauce-audio-browser.test.mjs

      - name: Atelier viande Coral - MP3 integrity and responsive player
        if: github.ref == 'refs/heads/feat/atelier3-viande-coral-mobile-20261018'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node scripts/check-workshop-audio.mjs --slug=saisir-viande-poele
          node tests/workshop-viande-audio-browser.test.mjs

      - name: Install Playwright video encoder
        run: node ./node_modules/playwright-core/cli.js install ffmpeg

      - name: V17 complete responsive browser regression (no video)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          V17_FULL_EVIDENCE: '0'
          V17_ONLY_NOJS: ${{ github.ref == 'refs/heads/feat/v17-finition-artistique-d11' && '1' || '0' }}
        run: node tests/v17-accueil-browser-smoke.mjs

      - name: V17 D25 focused mobile and desktop section 5 videos
        if: github.ref == 'refs/heads/feat/v17-finition-artistique-d11'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/v17-section5-two-videos.mjs

      - name: V19 photographic editorial pages QA
        if: github.ref == 'refs/heads/feat/v19-refonte-editoriale-photorealiste-20261016'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/v19-editorial-browser-qa.mjs

      - name: Upload V19 desktop and mobile editorial screenshots
        if: always() && github.ref == 'refs/heads/feat/v19-refonte-editoriale-photorealiste-20261016'
        uses: actions/upload-artifact@v4
        with:
          name: v19-editorial-visual-review
          path: artifacts/v19-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: V21 atelier tutorial responsive QA
        if: github.ref == 'refs/heads/feat/v20-ateliers-hero-pedagogie-20261017'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/v21-atelier-browser-qa.mjs

      - name: Upload V21 workshop tutorial screenshots
        if: always() && github.ref == 'refs/heads/feat/v20-ateliers-hero-pedagogie-20261017'
        uses: actions/upload-artifact@v4
        with:
          name: v21-workshop-tutorial-visual-review
          path: artifacts/v21-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Editorial French and mobile green contrast QA
        if: github.ref == 'refs/heads/fix/editorial-fr-food-copy-mobile-contrast-20261017'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/editorial-cuisine-contrast-qa.mjs

      - name: Upload recipe mobile contrast screenshots
        if: always() && github.ref == 'refs/heads/fix/editorial-fr-food-copy-mobile-contrast-20261017'
        uses: actions/upload-artifact@v4
        with:
          name: cuisine-recettes-contrast-visual-review
          path: artifacts/editorial-recettes-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Shared glossary-style editorial hero browser QA
        if: github.ref == 'refs/heads/feat/unified-editorial-heroes-glossary-template-20261017'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/shared-editorial-hero-browser-qa.mjs

      - name: Upload seven shared-page mobile and desktop screenshots
        if: always() && github.ref == 'refs/heads/feat/unified-editorial-heroes-glossary-template-20261017'
        uses: actions/upload-artifact@v4
        with:
          name: shared-glossary-page-frames
          path: artifacts/shared-hero-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: V17 D8 public homepage Lighthouse mobile audit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          V17_AUDIT_ROUTE: /
        run: node scripts/v17-lighthouse-audit.mjs

      - name: Upload V17 D25 focused video evidence
        if: always() && github.ref == 'refs/heads/feat/v17-finition-artistique-d11'
        uses: actions/upload-artifact@v4
        with:
          name: v17-d25-mobile-desktop-section5
          path: |
            artifacts/v17-d25-*.webm
            artifacts/v17-d25-*.png
            artifacts/v17-d25-*.json
            artifacts/v17-d27-*.png
            artifacts/v17-d27-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload V17 responsive screenshots and scroll videos
        if: always() && github.ref != 'refs/heads/feat/v17-finition-artistique-d11'
        uses: actions/upload-artifact@v4
        with:
          name: v17-accueil-d7-browser-evidence
          path: |
            artifacts/v17-accueil-*.png
            artifacts/v17-accueil-*.webm
            artifacts/v17-accueil-d7-metrics-*.json
            artifacts/v17-recipe-*.png
            artifacts/v17-lighthouse-mobile*.json
          retention-days: 7
          if-no-files-found: ignore
