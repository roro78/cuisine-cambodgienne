name: Social private dashboard targeted validation

on:
  push:
    branches:
      - review/social-approval-email-preview-20261025
    paths:
      - ".github/workflows/social-backoffice-p0-check.yml"
      - "public/gestion-social/index.php"
      - "public/gestion-social/catalog-readonly.php"
      - "public/gestion-social/n8n-wait-readonly.php"
      - "tests/php/social-n8n-wait-readonly-smoke.php"
      - "tests/php/social-catalog-readonly-smoke.php"
      - "automation/n8n/sql/social-viewer-role-provisioning-REVIEW.sql"
      - "tests/social-private-dashboard-contract.test.mjs"
      - "tests/social-private-dashboard-history.test.mjs"
      - "tests/social-private-dashboard-http-smoke.test.mjs"
      - "tests/social-one-shot-decision-flow.test.mjs"
      - "scripts/verify-social-dashboard-scope.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuisine-dashboard-p0-branch-only
  cancel-in-progress: true

jobs:
  offline-dashboard-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce dashboard-only PR scope (no n8n/catalog regressions)
        run: node scripts/verify-social-dashboard-scope.mjs
      - name: PHP syntax
        run: |
          php -l public/gestion-social/index.php
          php -l public/gestion-social/catalog-readonly.php
          php -l public/gestion-social/n8n-wait-readonly.php
          php -l tests/php/social-n8n-wait-readonly-smoke.php
          php tests/php/social-n8n-wait-readonly-smoke.php
          php -l tests/php/social-catalog-readonly-smoke.php
          php tests/php/social-catalog-readonly-smoke.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP dashboard static contracts
        run: node --test tests/social-private-dashboard-contract.test.mjs tests/social-private-dashboard-history.test.mjs tests/social-one-shot-decision-flow.test.mjs
      - name: Isolated PHP HTTP login, CSRF and original Wait handoff
        run: node --test tests/social-private-dashboard-http-smoke.test.mjs
