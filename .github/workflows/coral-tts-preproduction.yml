name: Coral TTS preproduction safety

on:
  push:
    branches:
      - 'feat/coral-tts-*'
    paths:
      - 'public/gestion-contenus/**'
      - 'tests/php/editorial-coral-culinary-review-smoke.php'
      - '.github/workflows/coral-tts-preproduction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/gestion-contenus/**'
      - 'tests/php/editorial-coral-culinary-review-smoke.php'
      - '.github/workflows/coral-tts-preproduction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tts-gate:
    name: PHP 8.3 / TTS launch must remain disabled
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: none
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Compile CMS and reference indexes locally
        run: npm run build
      - name: PHP syntax and human visa/TTS safety
        run: |
          php -l public/gestion-contenus/index.php
          php -l public/gestion-contenus/publication-gap-audit.php
          php -l tests/php/editorial-coral-culinary-review-smoke.php
          php tests/php/editorial-coral-culinary-review-smoke.php dist
      - name: No deployments or paid generation
        run: echo 'Offline contract only. No TTS, OpenAI, OVH, worker or MP3 mutation.'
